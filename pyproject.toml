[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nxtgenai"
version = "0.2.0"
description = "Offline cyberpunk AI pentest companion for Raspberry Pi Zero 2 W"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=12.1.1",
  "requests>=2.32.5",
  "aiohttp>=3.13.3",
  "Flask>=3.1.3",
  "pyzipper>=0.3.6",
  "llama-cpp-python>=0.3.16",
  "faiss-cpu>=1.12.0",
  "sentence-transformers>=5.1.2",
  "faster-whisper>=1.2.1",
  "zeroconf>=0.148.0",
  "RPi.GPIO>=0.7.1; platform_machine == 'armv6l' or platform_machine == 'armv7l' or platform_machine == 'armv8l' or platform_machine == 'aarch64'",
  "pyalsaaudio>=0.11.0; platform_machine == 'armv6l' or platform_machine == 'armv7l' or platform_machine == 'armv8l' or platform_machine == 'aarch64'",
  "pyaudio>=0.2.14; platform_machine == 'armv6l' or platform_machine == 'armv7l' or platform_machine == 'armv8l' or platform_machine == 'aarch64'",
]

[project.scripts]
jarvis-bud = "jarvis_bud.main:main"

[tool.setuptools.packages.find]
include = ["jarvis_bud*", "nxtgenai*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", ".venv", "venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.bandit]
skips = ["B101"]
